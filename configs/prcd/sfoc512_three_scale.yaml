# SFOC-512 main PRCD configuration.
#
# The profiler conservatively proposed scale-assigned P3/P4. The research
# requirement for the SFOC main experiment is stronger: every valid object is
# distilled at all three common detector scales (P3/P4/P5). Adaptive support,
# continuous-center sampling and the minimum support radius keep small-object
# support non-empty on P5.
distill:
  enabled: true
  levels: [P3, P4, P5]
  level_assignment: all

  support:
    mode: adaptive
    output_grid: 7
    fixed_window: 5
    context_margin: 1
    radius_min: 1
    radius_max: 4
    exclude_neighbor_objects: true
    core_supersample: 4
    min_core_mass: 0.001

  representation:
    adapter: conv1x1_groupnorm
    embedding_dim: 128
    aggregation: concat

  crc:
    enabled: true
    regions: 2
    temperature: 1.0
    response_source: class_logit
    # Provisional until the 512 teacher is available for loss-scale probing.
    weight: 0.1

  spd:
    enabled: true
    prototype_momentum: 0.99
    prototype_relation_enabled: false
    # Provisional until the 512 teacher is available for loss-scale probing.
    weight: 0.1

  icd:
    enabled: true
    min_instances: 2
    max_instances_per_class: 64
    exclude_diagonal: true
    pair_direction: false
    memory_assisted: false
    cross_rank_gather: false
    # Provisional until the 512 teacher is available for loss-scale probing.
    weight: 0.05

  optimization:
    distill_warmup_epochs: 10
    loss_weight_mode: magnitude_recommendation
    auto_apply_recommendation: false
    class_balanced_sampling_recommended: false

